<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB 파일 업로드 (DB File Upload)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .upload-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-sub);
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid #333;
            border-radius: 4px;
            color: var(--text-main);
        }

        button {
            background-color: var(--accent);
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container upload-container">
        <header>
            <h1>📂 데이터베이스 설정</h1>
            <p>beatoraja의 score.db와 scorelog.db 파일을 업로드해주세요.</p>
        </header>

        <form action="/setup" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="score_db">score.db 파일:</label>
                <input type="file" id="score_db" name="score_db" accept=".db" required>
            </div>
            <div class="form-group">
                <label for="scorelog_db">scorelog.db 파일:</label>
                <input type="file" id="scorelog_db" name="scorelog_db" accept=".db" required>
            </div>
            <button type="submit">업로드 및 시작</button>
        </form>
    </div>
</body>

</html>
